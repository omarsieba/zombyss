<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Reset Password · Zombyss</title>
<style>
:root{--bg:#1d1a45;--panel:#12141f;--ink:#f4f6fb;--mute:#a8b0c4;--line:rgba(255,255,255,.14);--acc:#ffc531;--bad:#ff5a6e;color-scheme:dark}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#3a2a5e,var(--bg) 60%,#0b0d14);color:var(--ink);font:16px/1.5 system-ui,sans-serif;padding:16px}
form{width:min(400px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:28px}label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--mute)}
input{font:inherit;color:var(--ink);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
button,a.b{font:inherit;font-weight:800;border:0;border-radius:10px;padding:12px;background:var(--acc);color:#1a1405;cursor:pointer;text-align:center;text-decoration:none}
#msg{min-height:22px;margin:0;font-size:14px}.bad{color:var(--bad)}
</style>
</head>
<body>
<form id="f">
  <h1>New password</h1>
  <label>New password<input type="password" id="p1" minlength="6" maxlength="72" autocomplete="new-password" required></label>
  <label>Type it again<input type="password" id="p2" minlength="6" maxlength="72" autocomplete="new-password" required></label>
  <button id="go">Save password</button>
  <p id="msg" role="status"></p>
  <a class="b" href="/play" id="back" hidden>Back to the game</a>
</form>
<script>
const token=new URLSearchParams(location.search).get('token')||'',msg=document.getElementById('msg');
if(!token){msg.textContent='This link is missing its code. Ask for a new reset email from the game.';msg.className='bad'}
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const p1=document.getElementById('p1').value,p2=document.getElementById('p2').value;
  if(p1!==p2){msg.textContent='The two passwords are different.';msg.className='bad';return}
  try{const r=await fetch('/api/auth/reset',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:p1})});const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(j.error||'Something went wrong');msg.textContent='Done! You are signed in with your new password.';msg.className='';document.getElementById('go').hidden=true;document.getElementById('back').hidden=false}
  catch(err){msg.textContent=err.message;msg.className='bad'}});
</script>
</body>
</html>
